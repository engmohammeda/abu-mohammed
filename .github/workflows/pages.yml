name: نشر الموقع

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "موقع/**"
      - ".github/workflows/pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: جلب الملفات
        uses: actions/checkout@v4
      - name: إعداد الصفحات
        uses: actions/configure-pages@v5
      - name: رفع مجلد الموقع
        uses: actions/upload-pages-artifact@v3
        with:
          path: موقع
      - name: النشر
        id: deployment
        uses: actions/deploy-pages@v4
